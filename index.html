<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consorcioweb — Sitio en construcción</title>
  <meta name="description" content="Estamos construyendo nuestra nueva página web. Muy pronto estaremos en línea.">
  <meta name="theme-color" content="#0E5C68">
  <link rel="icon" type="image/png" href="LogoCW.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Esferas decorativas de fondo -->
  <div class="bg-orbs" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
  </div>

  <main class="card">
    <img src="LogoCW.png" alt="Consorcioweb" class="logo">

    <span class="badge">
      <span class="badge-dot"></span>
      Sitio en construcción
    </span>

    <h1>Estamos construyendo algo<br><span class="grad">increíble</span></h1>

    <p class="lead">
      Nuestra nueva página web está en desarrollo. Muy pronto
      estaremos en línea.
    </p>

    <div class="progress" role="progressbar" aria-valuemin="0"
         aria-valuemax="100" aria-label="Progreso de construcción">
      <div class="progress-bar"></div>
    </div>
    <span class="progress-label">Trabajando en el sitio&hellip;</span>

    <a class="btn" href="mailto:consorcioweb@gmail.com">Contáctanos</a>
    <p class="email">consorcioweb@gmail.com</p>
  </main>

  <footer>
    <p>&copy; <span id="year"></span> Consorcioweb. Todos los derechos reservados. Venezuela</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
